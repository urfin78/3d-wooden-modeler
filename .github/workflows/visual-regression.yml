name: Visual regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install CI tooling
        working-directory: .github
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: .github
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        env:
          CI: '1'
          NODE_PATH: ${{ github.workspace }}/.github/node_modules
        run: |
          export PATH="${GITHUB_WORKSPACE}/.github/node_modules/.bin:${PATH}"
          set -o pipefail
          npx --prefix .github playwright test \
            --config tests/playwright.config.js \
            --grep "^visual:" \
            2>&1 | tee visual.log

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Visual regression"
            echo ""
            if [ -f visual.log ]; then
              echo '```'
              tail -n 60 visual.log
              echo '```'
            else
              echo "_No visual.log produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-regression-report
          path: |
            playwright-report
            tests/visual.spec.js-snapshots
          retention-days: 14
